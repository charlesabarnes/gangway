# gangway on the Docker host it manages, behind a reverse proxy that already owns the
# public 443 (this example uses Nginx Proxy Manager on Docker's default bridge).
#
#   docker compose up -d --build        # from this directory, on the host
#
#   internet :443 -> reverse proxy (holds the wildcard certificate)
#                     -> https://172.17.0.1:8443  gangway (self-signed; the proxy does not verify)
#                         -> 127.0.0.1:31xxx       the previews
#
# Host networking is deliberate. Previews publish their ports on the host's 127.0.0.1, which
# keeps them off the LAN and leaves gangway's visibility gate as the only way in. Only a
# process in the host's network namespace can reach them, so gangway cannot live on its own
# Docker network.
#
# gangway listens on docker0 (172.17.0.1) only: reachable by the proxy and the host, not the
# LAN. X-Forwarded-For is trusted from the bridge subnet and nowhere else.
#
# The Docker socket is root on the host. Do not expose gangway's API to anyone you would not
# give a shell on this machine; that is also why previews run under a compose policy.
#
# `.env` next to this file (never committed):
#   GANGWAY_ADMIN_TOKEN=gw_...            echo "gw_$(openssl rand -hex 24)"
#   GANGWAY_BASE_DOMAIN=preview.example.com
#   GANGWAY_INSTANCE=main                 names this installation's containers: gw-<instance>-<slug>
#   GANGWAY_STATE_PATH=/srv/gangway       SQLite database, logs, scratch
#
# Proxy host:  domains `*.<base>` and `<base>`  ->  https://172.17.0.1:8443
#   Websockets on, the wildcard certificate (DNS challenge), force SSL.
#   nginx:  proxy_read_timeout 600s;  proxy_send_timeout 600s;
#           client_max_body_size 512m;  proxy_request_buffering off;
#   (nginx's 60s default cuts off `?wait=true` deploys and builds; the last two are for
#   tarball uploads. SSE needs nothing: gangway sends `X-Accel-Buffering: no`.)
#
# Without a proxy in front (gangway owns 443 and its own certificate), set
#   GANGWAY_LISTEN_ADDRESS=::  GANGWAY_TLS_MODE=acme  GANGWAY_TRUSTED_PROXIES=
#   GANGWAY_CF_API_TOKEN=...   GANGWAY_ACME_DIRECTORY_URL=https://acme-v02.api.letsencrypt.org/directory
name: gangway
services:
  gangway:
    # One gangway per host, so a fixed name is fine here (previews may not have one).
    container_name: gangway
    image: gangway:${GANGWAY_TAG:-latest}
    build: .
    network_mode: host
    restart: unless-stopped
    # Must exceed GANGWAY_SHUTDOWN_GRACE_MS (8s), or Docker kills the drain halfway.
    stop_grace_period: 15s
    environment:
      GANGWAY_ADMIN_TOKEN: ${GANGWAY_ADMIN_TOKEN:?set GANGWAY_ADMIN_TOKEN in .env}
      GANGWAY_BASE_DOMAIN: ${GANGWAY_BASE_DOMAIN:?set GANGWAY_BASE_DOMAIN in .env}
      GANGWAY_INSTANCE: ${GANGWAY_INSTANCE:?set GANGWAY_INSTANCE in .env}
      GANGWAY_LISTEN_ADDRESS: ${GANGWAY_LISTEN_ADDRESS:-172.17.0.1}
      GANGWAY_LISTEN_PORT: ${GANGWAY_LISTEN_PORT:-8443}
      # Empty = no plain-HTTP redirect listener; the proxy does the redirect.
      GANGWAY_LISTEN_HTTP_PORT: ${GANGWAY_LISTEN_HTTP_PORT:-}
      # The port the outside world connects to, used in the URLs gangway hands out.
      GANGWAY_PUBLIC_PORT: ${GANGWAY_PUBLIC_PORT:-443}
      # The proxy holds the real certificate; this leg is self-signed and never seen by a browser.
      GANGWAY_TLS_MODE: ${GANGWAY_TLS_MODE:-selfsigned}
      GANGWAY_TRUSTED_PROXIES: ${GANGWAY_TRUSTED_PROXIES-172.17.0.0/16}
      GANGWAY_ACME_DIRECTORY_URL: ${GANGWAY_ACME_DIRECTORY_URL:-https://acme-staging-v02.api.letsencrypt.org/directory}
      GANGWAY_ACME_EMAIL: ${GANGWAY_ACME_EMAIL:-}
      GANGWAY_CF_API_TOKEN: ${GANGWAY_CF_API_TOKEN:-}
      # The first run against a daemon full of real workloads: look before it touches.
      # Switch to `stop` once a pass reports nothing surprising.
      GANGWAY_RECONCILE_ORPHANS: ${GANGWAY_RECONCILE_ORPHANS:-report}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${GANGWAY_STATE_PATH:?set GANGWAY_STATE_PATH in .env}:/state
