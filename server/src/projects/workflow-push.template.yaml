# gangway deploy for __NAME__ -- generated by gangway (__API__).
#
# On every push to __BRANCH__ this sends the branch's files to gangway, which builds them and
# rebuilds the project's production preview in place: same URL, same volumes and secrets. If the
# new version fails its checks, the previous one keeps serving. gangway trusts this run by its
# OIDC token, which GitHub signs for this repository and this branch: there is no secret to store.
#
# The first push that serves becomes the project's production preview. Its runtime secrets,
# visibility and template are the project's, set in gangway.
name: gangway deploy

on:
  push:
    branches: [__BRANCH__]

# One deploy at a time, in order: a rebuild in flight is not cancelled by the next push.
concurrency:
  group: gangway-deploy
  cancel-in-progress: false

env:
  GANGWAY_API: __API__
  GANGWAY_PROJECT: __SLUG__

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only what gangway needs: the files, and an OIDC token.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          set -euo pipefail
          oidc=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$GANGWAY_API" | jq -r .value)
          git archive --format=tar.gz -o source.tar.gz HEAD
          code=$(curl -sS -o result.json -w '%{http_code}' -X PUT "$GANGWAY_API/v1/projects/$GANGWAY_PROJECT/branch?sha=$GITHUB_SHA&wait=true" \
            -H "Authorization: Bearer $oidc" -H 'content-type: application/gzip' --data-binary @source.tar.gz)
          jq '{state: .preview.state, url: .preview.urls[0].url, error: .preview.error, detail: .detail}' result.json
          test "$code" -lt 300
