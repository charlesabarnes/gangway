# SonarQube Cloud automatic analysis. It reads only the keys listed at
# https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis
sonar.sources=server/src,shared/src,render/src,web/src,waitlist/src,scripts,site/js
sonar.tests=server/test,shared/test,render/test,waitlist/test,web/src
sonar.test.inclusions=server/test/**,shared/test/**,render/test/**,waitlist/test/**,web/src/**/*.spec.ts
sonar.exclusions=web/src/**/*.spec.ts,**/dist/**,site/js/brand-icons.js
sonar.sourceEncoding=UTF-8
