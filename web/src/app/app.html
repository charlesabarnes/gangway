@if (chrome()) {
  <header class="bg-header text-header-fg">
    <div class="flex h-14 items-center gap-8 overflow-x-auto px-4 whitespace-nowrap sm:px-8">
      <a routerLink="/" class="flex items-center gap-2.5">
        <app-mark [onDark]="true" /><span
          class="font-mono text-[19px] font-semibold tracking-[-.04em]"
          >gangway</span
        >
      </a>
      <nav class="flex h-full text-[13px] font-medium tracking-[.12em] uppercase" aria-label="Main">
        <a
          routerLink="/previews"
          routerLinkActive="!opacity-100 shadow-[inset_0_-3px_0_var(--gw-flag)]"
          class="flex items-center px-3.5 opacity-70 hover:opacity-100"
          data-testid="nav-previews"
          >Previews</a
        >
        <a
          routerLink="/artifacts"
          routerLinkActive="!opacity-100 shadow-[inset_0_-3px_0_var(--gw-flag)]"
          class="flex items-center px-3.5 opacity-70 hover:opacity-100"
          data-testid="nav-artifacts"
          >Artifacts</a
        >
        <a
          routerLink="/repositories"
          routerLinkActive="!opacity-100 shadow-[inset_0_-3px_0_var(--gw-flag)]"
          class="flex items-center px-3.5 opacity-70 hover:opacity-100"
          data-testid="nav-repositories"
          >Repositories</a
        >
        @if (admin()) {
          <a
            routerLink="/admin"
            routerLinkActive="!opacity-100 shadow-[inset_0_-3px_0_var(--gw-flag)]"
            class="flex items-center px-3.5 opacity-70 hover:opacity-100"
            data-testid="nav-admin"
            >Admin</a
          >
        }
      </nav>

      <div class="ml-auto flex items-center gap-[18px] text-sm">
        @switch (health()?.status) {
          @case ('draining') {
            <output class="text-flag" data-testid="health">shutting down</output>
          }
          @case ('unreachable') {
            <output class="text-danger" data-testid="health">server unreachable</output>
          }
        }
        @if (auth.user(); as user) {
          <app-user-menu [user]="user" (logout)="logout()" />
        } @else {
          <app-theme-toggle />
          <button
            type="button"
            (click)="logout()"
            class="opacity-70 hover:opacity-100"
            data-testid="logout"
          >
            Log out
          </button>
        }
      </div>
    </div>
  </header>
}
<router-outlet />
<app-toasts />
