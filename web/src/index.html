<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>gangway</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#0b2648" />
    <script>
      // Before the app boots, so the first paint is already in the right theme (ThemeService, gw-theme).
      try {
        var t = (/(?:^|;\s*)gw-theme=(light|dark)(?:;|$)/.exec(document.cookie) || [])[1];
        if (!t) t = localStorage.getItem('gw-theme');
        if (t !== 'light' && t !== 'dark')
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        // Signed in last time: paint the header now, before the app is up (AuthService keeps the flag).
        if (localStorage.getItem('gw-signed-in') === '1')
          document.documentElement.dataset.signedIn = '';
      } catch (e) {}
      // The session, asked for while the scripts download rather than after (AuthService takes it).
      window.gwSession = fetch('/v1/auth/session', { credentials: 'same-origin' }).then((r) =>
        r.ok ? r.json() : Promise.reject(r.status),
      );
      window.gwSession.catch(() => {});
    </script>
    <style>
      .gw-boot-header {
        display: none;
        height: 3.5rem;
        background: var(--gw-header);
      }
      [data-signed-in] .gw-boot-header {
        display: block;
      }
    </style>
  </head>
  <body>
    <app-root><div class="gw-boot-header"></div></app-root>
  </body>
</html>
