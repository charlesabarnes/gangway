# Serves the built site as GitHub Pages does: /cloud finds cloud.html, a folder its index.html,
# and anything else the site's own 404.html.
server {
  listen 8080;
  root /usr/share/nginx/html;
  absolute_redirect off;
  error_page 404 /404.html;
  location / {
    try_files $uri $uri.html $uri/ =404;
  }
}
