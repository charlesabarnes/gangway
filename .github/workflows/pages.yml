# Publishes site/ (the marketing pages) and guide/ (the docs, at /docs) to GitHub Pages.
# scripts/build-site.ts tags each stylesheet and script link with a hash of its file so browsers
# never mix deploys; the docs are an Astro Starlight build.
# The waitlist form posts to the Cloudflare Worker in waitlist/, which is deployed separately.
name: pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "guide/**"
      - ".github/assets/screenshots/**"
      - "scripts/build-site.ts"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun scripts/build-site.ts
      - run: bun install --frozen-lockfile && bun run build && cp -R dist ../dist/site/docs
        working-directory: guide
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - id: deployment
        uses: actions/deploy-pages@v4
