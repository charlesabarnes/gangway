# Publishes site/ (the marketing pages) and guide/ (the docs, at /docs) to GitHub Pages.
# scripts/build-site.ts tags each stylesheet and script link with a hash of its file so browsers
# never mix deploys; the docs are an Astro Starlight build.
# The waitlist form posts to the Cloudflare Worker in waitlist/, which is deployed separately.
name: pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "guide/**"
      - ".github/assets/screenshots/**"
      - "scripts/build-site.ts"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun scripts/build-site.ts
      - run: bun install --frozen-lockfile && bun run build && cp -R dist ../dist/site/docs
        working-directory: guide
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist/site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
