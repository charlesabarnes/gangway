# Publishes site/ (the marketing pages) to GitHub Pages. The only build step is scripts/build-site.ts,
# which tags each stylesheet and script link with a hash of its file so browsers never mix deploys.
# The waitlist form posts to the Cloudflare Worker in waitlist/, which is deployed separately.
name: pages

on:
  push:
    branches: [master]
    paths: ["site/**", "scripts/build-site.ts", ".github/workflows/pages.yml"]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun scripts/build-site.ts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - id: deployment
        uses: actions/deploy-pages@v4
