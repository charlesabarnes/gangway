# Publishes site/ (the marketing pages) and guide/ (the docs, at /docs) to GitHub Pages.
# scripts/build-site.ts tags each stylesheet and script link with a hash of its file so browsers
# never mix deploys; the docs are an Astro Starlight build.
# The waitlist form posts to the Cloudflare Worker in waitlist/, which is deployed separately.
name: pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "guide/**"
      - ".github/assets/screenshots/**"
      - "scripts/build-site.ts"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun scripts/build-site.ts
      - run: bun install --frozen-lockfile && bun run build && cp -R dist ../dist/site/docs
        working-directory: guide
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/site
          # v4+ drops dotfiles by default; keep /.well-known/security.txt.
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
