# CodeQL follows untrusted input through the TypeScript (into shell commands, paths, SQL and the
# Docker API) and checks the workflows themselves. Findings land in the Security tab.
name: codeql

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          # Reads `// codeql[rule-id] reason` on the line before a false positive (dismissed below).
          packs: ${{ matrix.language == 'javascript-typescript' && 'codeql/javascript-queries:AlertSuppression.ql' || '' }}
      - id: analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
          output: sarif-results
      # Dismissal is repo-wide, so only master's own run may do it; a PR only gets its SARIF marked.
      - if: github.ref == 'refs/heads/master' && matrix.language == 'javascript-typescript'
        uses: advanced-security/dismiss-alerts@a18f986bdb40edba0dd7a74382c15d4a3d50a1c8 # v2.0.3
        with:
          sarif-id: ${{ steps.analyze.outputs.sarif-id }}
          sarif-file: sarif-results
        env:
          GITHUB_TOKEN: ${{ github.token }}
