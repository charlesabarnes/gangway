# Publishes the image to ghcr.io/charlesabarnes/gangway for amd64 and arm64, and Unraid's
# gangway in a box (unraid/inabox) to ghcr.io/charlesabarnes/gangway-inabox for amd64, and
# attaches the files install.sh fetches (compose.yaml, install.sh) to the GitHub release.
#
# Nothing here runs on a push to master. A `v*` tag publishes `:<version>` and `:latest`;
# running it by hand publishes `:edge` from the chosen ref, for trying an unreleased build.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
          flavor: latest=${{ startsWith(github.ref, 'refs/tags/v') }}
      # Build amd64 locally first and refuse to publish an image with a fixable critical or high
      # vulnerability. The push below reuses the builder's layers. No GitHub Actions cache here: a
      # release must not build from layers a pull request could have written.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: gangway:scan
          build-args: GANGWAY_VERSION=${{ steps.meta.outputs.version }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gangway:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GANGWAY_VERSION=${{ steps.meta.outputs.version }}

  inabox:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-inabox
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
          flavor: latest=${{ startsWith(github.ref, 'refs/tags/v') }}
      # Unraid is amd64 only.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: unraid/inabox/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          no-cache: true
      # Upgrade steps first, then the PRs by label, then the Unraid template changes.
      - run: bun scripts/release-notes.ts > notes.md
        env:
          GH_TOKEN: ${{ github.token }}
      # install.sh reads /releases/latest/download/compose.yaml, so the two travel together.
      - run: gh release create "$GITHUB_REF_NAME" compose.yaml install.sh --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
