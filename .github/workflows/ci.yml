# Typecheck + unit tests + web build. NO Docker: the suite fakes the compose runner and the
# daemon (and was checked to pass with no `docker` on PATH). What this cannot prove is on
# purpose not attempted here -- see "A green fake proves nothing about the CLI" in
# docs/STATUS.md. Live verification runs against a real host, by hand.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # Bun strips types without checking them. This gate is the one that keeps the project honest.
      - run: bun run typecheck
      - run: bun test

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm test -- --watch=false
        working-directory: web
