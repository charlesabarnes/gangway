# gangway previews of gangway.sh and its docs, on demo.gangway.sh. Adapted from the workflow
# gangway generates for a project: rather than build and push an image, it builds the site and docs
# as pages.yml does and uploads the files, which gangway serves itself. It runs only for pull
# requests that touch what Pages publishes. That check is a job, not a `paths:` filter, so closing
# any pull request still tears its preview down.
#
# gangway trusts this run by its OIDC token, which GitHub signs for this repository and this pull
# request: there is no secret to store. Pull requests from forks are skipped: GitHub gives their
# runs no OIDC token. Visibility and TTL are the project's, set in gangway.
name: gangway preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: gangway-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

env:
  GANGWAY_API: https://api.demo.gangway.sh
  GANGWAY_PROJECT: gangway-site

jobs:
  # Does this pull request change what Pages publishes?
  changes:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      site: ${{ steps.files.outputs.site }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
          site=false
          if grep -qE '^(site/|guide/|\.github/assets/screenshots/|scripts/build-site\.ts$|\.github/workflows/gangway-preview\.yml$)' <<< "$files"; then
            site=true
          fi
          echo "site=$site" >> "$GITHUB_OUTPUT"

  deploy:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun scripts/build-site.ts
      - run: bun install --frozen-lockfile && bun run build && cp -R dist ../dist/site/docs
        working-directory: guide
      - id: deploy
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          oidc=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$GANGWAY_API" | jq -r .value)
          tar -czf site.tgz -C dist/site .
          code=$(curl -sS -o result.json -w '%{http_code}' -X PUT "$GANGWAY_API/v1/projects/$GANGWAY_PROJECT/pulls/$PR?sha=$SHA&wait=true" \
            -H "Authorization: Bearer $oidc" -H 'content-type: application/gzip' --data-binary @site.tgz)
          jq '{state: .preview.state, url: .preview.urls[0].url, error: .preview.error, detail: .detail}' result.json
          echo "url=$(jq -r '.preview.urls[0].url // empty' result.json)" >> "$GITHUB_OUTPUT"
          test "$code" -lt 300

  comment:
    needs: [changes, deploy]
    if: always() && needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ needs.deploy.outputs.url }}
          RESULT: ${{ needs.deploy.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker='<!-- gangway-preview -->'
          if [ "$RESULT" = success ] && [ -n "$URL" ]; then
            body=$(printf '%s\n**Preview ready:** %s (docs at [/docs/](%sdocs/))\n\n_Commit %s. Torn down when this pull request closes._' "$marker" "$URL" "$URL" "${SHA::7}")
          else
            body=$(printf '%s\n**Preview failed** for %s. [The run](%s) has gangway'"'"'s answer.' "$marker" "${SHA::7}" "$RUN")
          fi
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi

  teardown:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      pull-requests: write
    steps:
      - env:
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          oidc=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$GANGWAY_API" | jq -r .value)
          curl -fsS -X DELETE "$GANGWAY_API/v1/projects/$GANGWAY_PROJECT/pulls/$PR" -H "Authorization: Bearer $oidc"
          # The comment said "ready" with a URL that is now gone: say so instead.
          marker='<!-- gangway-preview -->'
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$(printf '%s\n_Preview torn down: this pull request is closed._' "$marker")" > /dev/null
          fi
